services:
  caddy:
    image: caddy:2-alpine
    container_name: learnloop-caddy
    restart: unless-stopped
    depends_on:
      - learnloop
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
